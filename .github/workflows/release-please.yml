name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare or publish release
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The built-in token works, but releases and pull requests it creates do
          # not trigger other workflows. Set RELEASE_PLEASE_TOKEN (a fine-grained
          # token with contents and pull-request write access) so a release tag
          # starts the Release workflow and release PRs run CI.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
