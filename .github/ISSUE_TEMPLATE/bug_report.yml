name: Bug report
description: Report something provlift does wrong or differently from its documentation.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security issues must not be reported here.** Use a private
        [security advisory](https://github.com/provlift/provlift/security/advisories/new) instead.

        Please check the [troubleshooting guide](https://github.com/provlift/provlift/blob/main/docs/troubleshooting/README.md)
        and existing issues first. Redact tokens, hostnames and other sensitive values from anything you paste.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        The exact `provlift` command(s) you ran and a minimal configuration that reproduces the problem,
        for example the relevant `required_providers` block, `.terraform.lock.hcl` entries and `.provlift.yaml`.
      placeholder: |
        1. versions.tf:
           terraform {
             required_providers {
               aws = { source = "hashicorp/aws", version = "~> 5.0" }
             }
           }
        2. provlift upgrade --level minor --dry-run
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant output, ideally with `--json`. It will be formatted as code automatically.
      render: shell

  - type: input
    id: provlift-version
    attributes:
      label: provlift version
      description: Output of `provlift version`.
      placeholder: "provlift v0.1.0 (commit abc1234, built 2026-01-01T00:00:00Z, go1.26.6 linux/amd64)"
    validations:
      required: true

  - type: dropdown
    id: tool
    attributes:
      label: Terraform or OpenTofu?
      options:
        - Terraform
        - OpenTofu
        - Not applicable (list / check / drift only)
    validations:
      required: true

  - type: input
    id: tool-version
    attributes:
      label: Terraform / OpenTofu version
      description: Output of `terraform version` or `tofu version`.

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: registry
    attributes:
      label: Provider registry
      description: Where do the affected providers come from?
      multiple: true
      options:
        - registry.terraform.io
        - registry.opentofu.org
        - Private registry (HCP Terraform, Terraform Enterprise or other)
        - Not sure

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: CI system, workflow file, links to related issues, or anything else that helps.
